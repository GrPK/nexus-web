# Fork-only check for feat/lianli-hub-page (not part of the PR): installs, tests, lints and builds the
# dashboard on GitHub's runner, and uploads the service build for a local test. The baseline job runs
# the same full checks on the upstream main this branch starts from, so failures that were already
# there can be told apart.
name: fork-check

on:
  push:
    branches: [ci-lianli-hub-page]
  workflow_dispatch:

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests of the changed files and the pages that use them
        run: >-
          npx vitest run
          src/components/views/DevicePage/LianLiHubPage.test.tsx
          src/components/views/DevicePage/LianLiSyncAllBar.test.tsx
          src/hooks/groupLianLiDevices.test.ts
          src/hooks/useUnifiedDevices.test.ts
          src/app/SidebarDevicesSection.test.tsx
          src/panel/widgets/devices/DevicesPage.test.tsx
          src/components/views/DevicePage/DevicePage.test.tsx
          src/components/views/DevicePage/DevicePage.claimedPanel.test.tsx
          src/components/views/DevicePage/DevicePage.title.test.tsx
          src/search/TopSearch.test.tsx
          src/components/views/DevicePage/LianLiWirelessLightingTab.test.tsx
          src/components/views/DevicePage/lianliChainUtils.test.ts
          src/components/views/DevicePage/LianLiFlexLightingTab.test.tsx
          src/components/views/DevicePage/HydroShift2RingSettings.test.tsx
          src/api/hydroshift2Curve.test.ts
      - name: Lint of the changed files
        run: >-
          npx eslint
          src/api/lianli-sync.ts
          src/api/lianli-wireless.ts
          src/api/hydroshift2.ts
          src/api/hydroshift2Curve.ts
          src/hooks/useUnifiedDevices.ts
          src/hooks/groupLianLiDevices.test.ts
          src/app/SidebarDevicesSection.tsx
          src/panel/widgets/devices/DevicesPage.tsx
          src/components/views/DevicePage/DevicePage.tsx
          src/components/views/DevicePage/LianLiHubPage.tsx
          src/components/views/DevicePage/LianLiHubPage.test.tsx
          src/components/views/DevicePage/LianLiSyncAllBar.tsx
          src/components/views/DevicePage/LianLiSyncAllBar.test.tsx
          src/components/views/DevicePage/HydroShift2RingSettings.tsx
          src/components/views/DevicePage/LianLiWirelessLightingTab.tsx
          src/components/views/DevicePage/lianliChainUtils.ts
      - name: Locale parity
        run: node scripts/audit-locales.mjs
      - name: Type check and service build
        run: npm run build:service
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-web-service-dist
          path: dist
          retention-days: 14
      - name: Full test suite
        if: always()
        continue-on-error: true
        run: npm test
      - name: Full lint
        if: always()
        continue-on-error: true
        run: npm run lint

  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hello-nexus/nexus-web
          ref: 933eb031357f8879f365da86e0174695bb7f37f4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full test suite on main
        continue-on-error: true
        run: npm test
      - name: Full lint on main
        if: always()
        continue-on-error: true
        run: npm run lint

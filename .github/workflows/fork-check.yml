# Fork-only check for fix/slider-thumb-path (slider-pr job) + feat/tl-zone-select + fix/slider-thumb-path + feat/astral-device-page (not part of the PRs): installs, tests, lints and builds the
# dashboard on GitHub's runner, and uploads the service build for a local test. The baseline job runs
# the same full checks on main, so failures that were already there can be told apart.
name: fork-check

on:
  push:
    branches: [ci-build, ci-slider-thumb-path, ci-astral, ci-g560]
  workflow_dispatch:

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests of the changed page
        run: npx vitest run src/components/views/DevicePage/LianLiWirelessLightingTab.test.tsx src/components/common/Slider src/components/views/SettingsView/ThermalGuardSetting.test.tsx src/panel/widgets/lighting/studio/StudioBlockCard.test.tsx src/components/views/DevicePage/AstralDevicePage.test.tsx src/components/views/DevicePage/astralUtils.test.ts src/components/views/DevicePage/DevicePage.test.tsx src/components/views/DevicePage/LogitechSpeakerDevicePage.test.tsx src/components/views/DevicePage/speakerUtils.test.ts
      - name: Lint of the changed files
        run: npx eslint src/api/lianli-wireless.ts src/components/views/DevicePage/LianLiWirelessLightingTab.tsx src/components/views/DevicePage/LianLiWirelessLightingTab.test.tsx src/components/common/Slider/Slider.tsx src/components/common/Slider/Slider.test.tsx src/api/astral.ts src/components/views/DevicePage/AstralArt.tsx src/components/views/DevicePage/AstralDevicePage.tsx src/components/views/DevicePage/AstralDevicePage.test.tsx src/components/views/DevicePage/astralUtils.ts src/components/views/DevicePage/astralUtils.test.ts src/components/views/DevicePage/DevicePage.tsx src/api/logitechSpeaker.ts src/components/views/DevicePage/LogitechSpeakerDevicePage.tsx src/components/views/DevicePage/LogitechSpeakerDevicePage.test.tsx src/components/views/DevicePage/SpeakerEqSlider.tsx src/components/views/DevicePage/SpeakerArt.tsx src/components/views/DevicePage/speakerUtils.ts src/components/views/DevicePage/speakerUtils.test.ts src/hooks/useUnifiedDevices.ts
      - name: Locale parity
        run: node scripts/audit-locales.mjs
      - name: Type check and service build
        run: npm run build:service
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-web-service-dist
          path: dist
          retention-days: 14
      - name: Full test suite
        if: always()
        continue-on-error: true
        run: npm test
      - name: Full lint
        if: always()
        continue-on-error: true
        run: npm run lint

  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full test suite on main
        continue-on-error: true
        run: npm test
      - name: Full lint on main
        if: always()
        continue-on-error: true
        run: npm run lint

  g560-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g560-device-page
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests of the G560 page and the device page
        run: npx vitest run src/components/views/DevicePage/DevicePage.test.tsx src/components/views/DevicePage/LogitechSpeakerDevicePage.test.tsx src/components/views/DevicePage/speakerUtils.test.ts
      - name: Lint of the changed files
        run: npx eslint src/components/views/DevicePage/DevicePage.tsx src/api/logitechSpeaker.ts src/components/views/DevicePage/LogitechSpeakerDevicePage.tsx src/components/views/DevicePage/LogitechSpeakerDevicePage.test.tsx src/components/views/DevicePage/SpeakerEqSlider.tsx src/components/views/DevicePage/SpeakerArt.tsx src/components/views/DevicePage/speakerUtils.ts src/components/views/DevicePage/speakerUtils.test.ts src/hooks/useUnifiedDevices.ts
      - name: Locale parity
        run: node scripts/audit-locales.mjs
      - name: Type check and service build
        run: npm run build:service
      - name: Full test suite
        if: always()
        continue-on-error: true
        run: npm test
      - name: Full lint
        if: always()
        continue-on-error: true
        run: npm run lint

  slider-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/slider-thumb-path
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests of the slider and the screens with a zero mark or marker
        run: npx vitest run src/components/common/Slider src/components/views/SettingsView/ThermalGuardSetting.test.tsx src/panel/widgets/lighting/studio/StudioBlockCard.test.tsx
      - name: Lint of the changed files
        run: npx eslint src/components/common/Slider/Slider.tsx src/components/common/Slider/Slider.test.tsx
      - name: Type check and service build
        run: npm run build:service
      - name: Full test suite
        if: always()
        run: npm test
      - name: Full lint
        if: always()
        run: npm run lint

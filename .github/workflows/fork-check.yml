# Fork-only check for feat/lianli-screen88-screen-settings (not part of the PR): installs, tests,
# lints and builds the dashboard on GitHub's runner, and uploads the service build for a local test.
# The baseline job runs the same full checks on the upstream main this branch starts from, so
# failures that were already there can be told apart.
name: fork-check

on:
  push:
    branches: [ci-lianli-screen88-screen-settings]
  workflow_dispatch:

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests of the changed files and the pages that use them
        run: >-
          npx vitest run
          src/api/lianliScreen88.test.ts
          src/api/lianli-sync.test.ts
          src/api/hydroshift2Curve.test.ts
          src/components/views/DevicePage/LianLiScreen88Settings.test.tsx
          src/components/views/DevicePage/useLianLiScreen88Screen.test.ts
          src/components/views/DevicePage/DevicePage.
          src/components/views/DevicePage/PanelDevicePage.
          src/components/views/DevicePage/LianLiHubPage.test.tsx
          src/components/views/DevicePage/LianLiSyncAllBar.test.tsx
          src/components/views/DevicePage/LianLiWireless
          src/components/views/DevicePage/LianLiFlex
          src/components/views/DevicePage/lianliChainUtils.test.ts
          src/components/views/DevicePage/HydroShift2CurveSettings.test.tsx
          src/components/views/DevicePage/useHydroShift2CurveScreen.test.ts
          src/components/views/DevicePage/HydroShift2RingSettings.test.tsx
          src/hooks/groupLianLiDevices.test.ts
      - name: Lint of the changed files
        run: >-
          npx eslint
          src/api/lianliScreen88.ts
          src/api/lianliScreen88.test.ts
          src/api/lianli-sync.ts
          src/components/views/DevicePage/LianLiScreen88Settings.tsx
          src/components/views/DevicePage/LianLiScreen88Settings.test.tsx
          src/components/views/DevicePage/useLianLiScreen88Screen.ts
          src/components/views/DevicePage/useLianLiScreen88Screen.test.ts
          src/components/views/DevicePage/DevicePage.tsx
          src/components/views/DevicePage/DevicePage.screen88.test.tsx
          src/components/views/DevicePage/LianLiHubPage.tsx
          src/components/views/DevicePage/LianLiHubPage.test.tsx
          src/components/views/DevicePage/PanelDevicePage.tsx
          src/components/views/DevicePage/LianLiSyncAllBar.tsx
          src/components/views/DevicePage/LianLiSyncAllBar.test.tsx
          src/components/views/DevicePage/LianLiChainEffectControls.tsx
          src/components/views/DevicePage/HydroShift2CurveSettings.tsx
          src/components/views/DevicePage/HydroShift2CurveSettings.test.tsx
          src/components/views/DevicePage/PanelDevicePage.lianliSettings.test.tsx
      - name: Locale parity
        run: node scripts/audit-locales.mjs
      - name: Type check and service build
        run: npm run build:service
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-web-service-dist
          path: dist
          retention-days: 14
      - name: Full test suite
        if: always()
        continue-on-error: true
        run: npm test
      - name: Full lint
        if: always()
        continue-on-error: true
        run: npm run lint

  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hello-nexus/nexus-web
          ref: 933eb031357f8879f365da86e0174695bb7f37f4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full test suite on main
        continue-on-error: true
        run: npm test
      - name: Full lint on main
        if: always()
        continue-on-error: true
        run: npm run lint
